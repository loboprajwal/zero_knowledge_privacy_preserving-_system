[package]
name = "mopro-bindings"
version = "0.1.0"
edition = "2021"
description = "Mopro native proving engine & Groth16 bindings for zk-MatchID"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "mopro_bindings"

[dependencies]
# Mopro and UniFFI
mopro-ffi = { version = "0.1", optional = true }
uniffi = { version = "0.25", features = ["cli"] }

# Cryptography & Serialization
ark-bn254 = "0.4.0"
ark-groth16 = "0.4.0"
ark-snark = "0.4.0"
ark-serialize = { version = "0.4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libc = "0.2"

[features]
default = []
mopro = ["dep:mopro-ffi"]

[build-dependencies]
uniffi = { version = "0.25", features = ["build"] }
